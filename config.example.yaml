# Скопируйте в config.yaml рядом с perco-meal.exe и заполните пароль.
perco:
  url: http://192.168.1.106
  login: meal-service        # отдельный оператор PERCo, достаточно прав на чтение
  password: "ЗАМЕНИТЕ"

listen: ":8080"              # дашборд: http://<этот-ПК>:8080
db: perco-meal.db
utc_offset_hours: 5          # временная зона сервера PERCo
poll_seconds: 1
staff_refresh_minutes: 30

device_ids: [2]              # «Односторонний замок №1» — вход в «Столовая1»

# Шаблоны питания. Каждый интервал шаблона — отдельное окно (один проход на интервал): у «Ночников» три
# интервала → окна n1, n2, n3. Если окна разных шаблонов пересекаются, проход засчитывается в окно
# шаблона, который есть у сотрудника. key задаёт цвет: b завтрак, l обед, d ужин, n ночники, r рамадан.
meals:
  - {key: b, name: Завтрак, template_id: 3}
  - {key: l, name: Обед,    template_id: 4}
  - {key: d, name: Ужин,    template_id: 5}
  - {key: n, name: Ночники, template_id: 6}
  - {key: r, name: Рамадан, template_id: 7}

pass_event_ids: [17]         # «Проход по идентификатору»
deny_event_ids: []           # дополнительные коды отказа; основные (8, 264, 273, 520, 529, 776, 785) встроены
door_event_ids: [31]         # «ИУ не закрыто после прохода»

reset_monitor:
  enabled: false             # включить, когда настроены задачи сброса перед окнами
  event_ids: []              # доп. коды; 16055 «Очистить пространственные зоны: Выполнено» встроен
  lookback_minutes: 90       # сброс ищется в этом интервале перед началом окна

backup_reset: false          # true — служба сама отправит сброс, если задача PERCo не сработала

# Блокировка повторного прохода: после первого прохода в окне сотрудник блокируется в PERCo до конца окна.
# Режим (ВЫКЛ / ТЕСТ / ВКЛ) переключается кнопкой «Блокировка» на дашборде, по умолчанию ВЫКЛ.
# Аварийно: perco-meal.exe unblock-all  — выключает режим и снимает все блокировки службы.
blocking:
  force_off: false           # true — блокировка отключена полностью, независимо от кнопки
  admin_pin: ""              # PIN для кнопок; пустой — управление с дашборда отключено
  test_user_ids: []          # кого блокировать в режиме ТЕСТ, например [960]
  max_hours: 3               # ни одна блокировка не держится дольше
