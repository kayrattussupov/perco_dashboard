<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Столовая</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#E9EEF2; --panel:#FFFFFF; --ink:#16212B; --muted:#5B6B78; --line:#CFD8E0;
  --steel:#2D4A63; --ok:#1F7A55; --ok-bg:#DDF1E7; --warn:#B3261E; --warn-bg:#FBE1DE;
  --amber:#B86E00; --amber-bg:#FCEFD9; --teal:#0F7A80; --indigo:#4A4FB0; --soft:#F4F7F9;
  --lost:#7B3FB0; --lost-bg:#EFE4F8;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A21; --panel:#1A242D; --ink:#E6EDF2; --muted:#93A4B2; --line:#2C3A46;
    --steel:#8FB3D1; --ok:#5CCB98; --ok-bg:#16352A; --warn:#FF8A80; --warn-bg:#3D1C1A;
    --amber:#F0A63A; --amber-bg:#3A2A12; --teal:#4CC3C9; --indigo:#9EA3F5; --soft:#202C36;
    --lost:#CDA4F5; --lost-bg:#2E2140;
  }
}
:root[data-theme="dark"]{
  --bg:#121A21; --panel:#1A242D; --ink:#E6EDF2; --muted:#93A4B2; --line:#2C3A46;
  --steel:#8FB3D1; --ok:#5CCB98; --ok-bg:#16352A; --warn:#FF8A80; --warn-bg:#3D1C1A;
  --amber:#F0A63A; --amber-bg:#3A2A12; --teal:#4CC3C9; --indigo:#9EA3F5; --soft:#202C36;
  --lost:#CDA4F5; --lost-bg:#2E2140;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.mono{font-family:"Unbounded","Golos Text",sans-serif;font-variant-numeric:tabular-nums}
.meal-b{color:var(--amber)} .meal-l{color:var(--teal)} .meal-d{color:var(--indigo)} .meal-x{color:var(--muted)}
.meal-n{color:var(--steel)} .meal-r{color:var(--ok)} .meal-t{color:var(--warn)}

/* Shell */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--soft);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;align-items:center}
.btn{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;background:transparent;text-decoration:none;font-size:14px}
.window{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.bad{background:var(--warn)}
.alerts{max-width:1400px;margin:14px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:8px}
.alert{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}
.view{display:none;max-width:1400px;margin:0 auto;padding:16px 20px 30px}
.view.on{display:block}
.chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--soft);border:1px solid var(--line);margin:2px 4px 2px 0}
.chip.deny{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.chip.deny.lost{background:var(--lost-bg);border-color:var(--lost);color:var(--lost)}
.avatar{flex:none;display:grid;place-items:center;color:#fff;font-family:"Unbounded",sans-serif;font-weight:500;border-radius:10px;overflow:hidden}
.avatar.unknown{background:var(--warn);font-size:1.4em}
.avatar img{width:100%;height:100%;object-fit:cover}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 5px var(--steel)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.kiosk .bar{display:none}

/* B: Kiosk */
.kiosk{min-height:calc(100vh - 110px);border-radius:18px;display:grid;place-items:center;text-align:center;padding:40px 20px;transition:background .3s;background:var(--panel);border:1px solid var(--line)}
body.kiosk .kiosk{min-height:calc(100vh - 40px)}
.kiosk.ok{background:var(--ok-bg);border-color:var(--ok)}
.kiosk.warn{background:var(--warn-bg);border-color:var(--warn)}
.kiosk.lost{background:var(--lost-bg);border-color:var(--lost)}
.kiosk .verdict{font-size:clamp(22px,3vw,34px);font-weight:700;margin-bottom:22px}
.kiosk.ok .verdict{color:var(--ok)} .kiosk.warn .verdict{color:var(--warn)} .kiosk.lost .verdict{color:var(--lost)}
.kiosk .avatar{width:150px;height:180px;font-size:48px;margin:0 auto 20px}
.kiosk .kname{font-size:clamp(26px,4vw,46px);font-weight:700;line-height:1.15;margin:0}
.kiosk .krole{color:var(--muted);font-size:18px;margin:6px 0 26px}
.kiosk .kn{font-family:"Unbounded",sans-serif;font-weight:700;font-size:clamp(90px,14vw,170px);line-height:.9}
.kiosk.warn .kn{color:var(--warn)} .kiosk.lost .kn{color:var(--lost)}
.kiosk .klbl{font-size:18px;color:var(--muted);margin-bottom:16px}
.kiosk .chip{font-size:17px;padding:4px 12px}
.kiosk .idle{color:var(--muted);font-size:22px}
.kiosk .idle b{display:block;font-size:clamp(28px,4vw,44px);color:var(--ink);margin-bottom:8px}

/* C: Feed */
.feedgrid{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media (max-width:900px){.feedgrid{grid-template-columns:1fr}}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ev{display:grid;grid-template-columns:76px 46px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{font-family:"Unbounded",sans-serif;font-weight:500;font-variant-numeric:tabular-nums;font-size:14px}
.ev .avatar{width:46px;height:46px;font-size:15px;border-radius:50%}
.ev .who{font-weight:600}
.ev .dep{color:var(--muted);font-size:13px}
.badge{border-radius:20px;padding:4px 12px;font-weight:600;font-size:13px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.lost{background:var(--lost-bg);color:var(--lost)}
.ev.unknown{background:var(--warn-bg);box-shadow:inset 4px 0 0 var(--warn)}
.ev.lost{background:var(--lost-bg);box-shadow:inset 4px 0 0 var(--lost)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.ev.new{animation:flash .9s ease-out}
.side{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{margin:0 0 10px;font-size:15px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-family:"Unbounded",sans-serif;font-weight:500}
.replist div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.replist div:last-child{border-bottom:0}
.replist span:last-child{color:var(--warn);font-weight:700}
@media (max-width:560px){.ev{grid-template-columns:60px 1fr auto}.ev .avatar{display:none}}

/* D: Meals board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.col-head{padding:14px 16px;border-bottom:3px solid currentColor;display:flex;justify-content:space-between;align-items:baseline}
.col-head h3{margin:0;font-size:18px}
.col-head small{color:var(--muted)}
.col-head .mono{font-size:26px}
.col-body{padding:6px 0;max-height:60vh;overflow:auto}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 16px}
.row.rep{background:var(--warn-bg)}
.row .rn{font-weight:500}
.row .rt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.row.rep .rt{color:var(--warn);font-weight:600}
.row.flash{animation:flash .9s ease-out}
.empty{padding:20px 16px;color:var(--muted);font-size:14px}
.notyet{margin-top:16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.notyet h3{margin:0 0 6px;font-size:15px}

/* A: Operator */
.op{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px}
@media (max-width:900px){.op{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start}
.state{border-radius:10px;padding:9px 12px;font-weight:600;margin-bottom:14px}
.state.ok{background:var(--ok-bg);color:var(--ok)} .state.warn{background:var(--warn-bg);color:var(--warn)} .state.idle{background:var(--soft);color:var(--muted)}
.state.lost{background:var(--lost-bg);color:var(--lost)}
.person{display:flex;gap:14px;align-items:center}
.person .avatar{width:80px;height:96px;font-size:24px}
.pname{font-size:20px;font-weight:700;margin:0 0 2px;line-height:1.2}
.prole{color:var(--muted);margin:0}
.big{display:flex;align-items:flex-end;gap:12px;margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.big .mono{font-weight:700;font-size:58px;line-height:.9}
.big .mono.warn{color:var(--warn)} .big .mono.lost{color:var(--lost)}
.big span{color:var(--muted);padding-bottom:5px}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.twrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:500;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
tr.rep td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.lost td:first-child{box-shadow:inset 4px 0 0 var(--lost)}
td.num{text-align:center;font-family:"Unbounded",sans-serif;font-weight:500;font-size:17px}
td.num.warn{color:var(--warn)}

/* Blocking switch, panel, PIN dialog */
.pill{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;background:var(--soft);color:var(--muted)}
.pill.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.test{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.pill.forced{text-decoration:line-through}
.pill.static{cursor:default}
.pill.st-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.st-syncing,.pill.st-settling{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.pill.st-offline,.pill.st-unreachable{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.lcol{display:flex;flex-direction:column;gap:20px;align-self:start}
.blk h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blk .row{padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.blk .row:last-child{border-bottom:0}
.blk small{color:var(--muted)}
.blk .err{color:var(--warn);font-size:13px}
.blk-total{font-size:20px;font-variant-numeric:tabular-nums}
.blk-total.some{color:var(--warn)}
.blk .mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--panel);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px}
dialog p{color:var(--muted);margin:0 0 14px;font-size:14px}
dialog input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:18px;letter-spacing:4px;margin-bottom:14px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.modes button,.dlg-actions button{border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600;cursor:pointer;background:var(--soft)}
.modes button.sel{outline:3px solid var(--steel)}
.modes .m-off{color:var(--muted)} .modes .m-test{color:var(--amber)} .modes .m-on{color:var(--ok)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end}
.dlg-actions .primary{background:var(--steel);color:var(--panel);border-color:var(--steel)}
.dlg-msg{min-height:20px;font-size:14px;margin-bottom:8px}
.dlg-msg.bad{color:var(--warn)} .dlg-msg.good{color:var(--ok)}
</style>
</head>
<body>

<div class="bar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="a" aria-selected="true">Рабочее место</button>
    <button class="tab" role="tab" data-v="b" aria-selected="false">Табло у входа</button>
    <button class="tab" role="tab" data-v="c" aria-selected="false">Лента событий</button>
    <button class="tab" role="tab" data-v="d" aria-selected="false">По приёмам пищи</button>
  </div>
  <div class="tools">
    <span class="window" id="window"></span>
    <span class="pill static" id="prcPill" title="Состояние связи PERCo-Web с контроллером">PERCo: …</span>
    <button class="pill" id="blkPill" title="Блокировка повторных проходов — нажмите, чтобы изменить">Блокировка: …</button>
    <a class="btn" id="report" href="/api/report.csv" title="Проходы за текущий месяц, CSV для Excel">Отчёт за месяц</a>
    <span><span class="dot" id="dot"></span><span class="mono" id="clock" style="font-size:18px">--:--</span></span>
  </div>
</div>

<div class="alerts" id="alerts"></div>

<section class="view on" id="v-a">
  <div class="op">
    <div class="lcol">
      <div class="card" id="aCard"></div>
      <div class="card blk" id="blkPanel"></div>
      <div class="card blk" id="svcPanel"></div>
    </div>
    <div>
      <input class="search" id="aSearch" type="search" placeholder="Поиск по фамилии" aria-label="Поиск по фамилии">
      <div class="twrap"><table><thead><tr><th>Сотрудник</th><th>Шаблон</th><th>Проходы сегодня</th><th style="text-align:center;white-space:nowrap">Кол-во</th></tr></thead><tbody id="aRows"></tbody></table></div>
    </div>
  </div>
</section>

<section class="view" id="v-b"><div class="kiosk" id="kiosk"></div></section>

<section class="view" id="v-c">
  <div class="feedgrid">
    <div class="feed" id="feed"></div>
    <div class="side">
      <div class="box"><h3>Сегодня с 00:00</h3><div id="cStats"></div></div>
      <div class="box"><h3>Повторные проходы и отказы</h3><div class="replist" id="cRep"></div></div>
    </div>
  </div>
</section>

<section class="view" id="v-d">
  <div class="board" id="board"></div>
  <div class="notyet" id="notyet"></div>
</section>

<dialog id="dlg">
  <h3 id="dlgTitle">Блокировка повторных проходов</h3>
  <p id="dlgText"></p>
  <div class="modes" id="dlgModes">
    <button class="m-off" data-mode="off">ВЫКЛ</button>
    <button class="m-test" data-mode="test">ТЕСТ</button>
    <button class="m-on" data-mode="on">ВКЛ</button>
  </div>
  <input id="dlgPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN администратора">
  <div class="dlg-msg" id="dlgMsg"></div>
  <div class="dlg-actions">
    <button id="dlgCancel">Закрыть</button>
    <button class="primary" id="dlgOk">Применить</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
